name: CI

# main = deployable. This workflow is the gate that keeps that true.
# C-029 (2026-09-06): the remote now exists (github.com/ngwkhai/share-fridge) and this
# workflow runs on every push to main and every PR targeting it. Branch protection makes
# build-and-test a required check; see DEPLOY_GUIDE.md.
#
# The e2e steps are gated on the BASE_URL repository VARIABLE only. The `secrets` context
# is NOT available in `if:` expressions - using it there makes the whole workflow file
# invalid and GitHub refuses to schedule any job at all (zero jobs, no annotation).
# Set BASE_URL as a repo variable to turn the Playwright steps on; the value itself may
# still come from a secret of the same name via `env`.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.versioncode.outputs.value }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Monotonic Android versionCode derived from main's commit count.
    # Consumed by the TWA packaging card (C-043). Must never decrease.
    - name: Compute versionCode
      id: versioncode
      run: |
        VC=$(git rev-list --count origin/main 2>/dev/null || git rev-list --count HEAD)
        echo "value=$VC" >> "$GITHUB_OUTPUT"
        echo "versionCode=$VC"

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Runtime spec must match its source
      run: |
        node server/build-openapi.js --stdout > /tmp/generated.json
        diff <(jq -S . /tmp/generated.json) <(jq -S . server/openapi.json) \
          || { echo "server/openapi.json is stale - run npm run api:spec"; exit 1; }

    - name: Run unit and contract tests
      run: npm test
      env:
        SKIP_PROVIDER_TESTS_IF_NO_CREDENTIALS: 'true'

    - name: Install Playwright Browsers
      if: ${{ vars.BASE_URL != '' }}
      run: npx playwright install --with-deps chromium

    - name: Run Playwright tests
      if: ${{ vars.BASE_URL != '' }}
      run: npm run test:e2e
      env:
        BASE_URL: ${{ secrets.BASE_URL || vars.BASE_URL }}

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: |
          playwright-report/
          e2e/results/
        retention-days: 30
